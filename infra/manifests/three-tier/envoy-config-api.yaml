apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config-api
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_http
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        per_connection_buffer_limit_bytes: 32768
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              common_http_protocol_options:
                max_requests_per_connection: 50
                idle_timeout: 300s
              route_config:
                name: local_route
                virtual_hosts:
                - name: api
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: api
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: api
        connect_timeout: 0.2s
        type: STATIC
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 512
            max_pending_requests: 512
            max_requests: 512
            max_retries: 3
        load_assignment:
          cluster_name: api
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 5001

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
