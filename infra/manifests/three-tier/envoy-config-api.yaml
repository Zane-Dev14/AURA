apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config-api
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_http
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: api
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: api }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: api
        connect_timeout: 0.2s
        type: STATIC           # ✅ Changed from STRICT_DNS
        load_assignment:
          cluster_name: api
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1    # ✅ Changed: route to LOCAL container
                    port_value: 5001      # ✅ Changed: API container port

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901