apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        metrics: envoy
    spec:
      containers:
      - name: db
        image: project-db:local
        imagePullPolicy: Never
        command:
            - /bin/bash
            - -c
            - |
                cat > /etc/mysql/conf.d/performance.cnf <<'EOF'
                [mysqld]
                max_connections = 500
                max_connect_errors = 1000
                connect_timeout = 10
                wait_timeout = 600
                max_allowed_packet = 64M
                innodb_buffer_pool_size = 256M
                innodb_flush_log_at_trx_commit = 2
                innodb_flush_method = O_DIRECT
                EOF

                # Start MySQL normally
                exec docker-entrypoint.sh mysqld

        env:
          - name: MYSQL_DATABASE
            value: quotesdb
          - name: MYSQL_ROOT_PASSWORD
            value: root
          - name: MYSQL_USER
            value: user
          - name: MYSQL_PASSWORD
            value: password
        ports:
          - containerPort: 3306
            name: mysql-internal
        volumeMounts:
          - name: mysql-data
            mountPath: /var/lib/mysql
          - name: mysql-init
            mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 768Mi
        readinessProbe:
          exec:
            command:
              - mysqladmin
              - ping
              - -h
              - localhost
              - -u
              - root
              - -proot
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
              - mysqladmin
              - ping
              - -h
              - localhost
              - -u
              - root
              - -proot
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

      - name: envoy
        image: envoyproxy/envoy:v1.29-latest
        command:
          - /usr/local/bin/envoy
          - -c
          - /etc/envoy/envoy.yaml
          - --service-cluster
          - db
        ports:
          - containerPort: 3307
            name: mysql
          - containerPort: 9901
            name: envoy-admin
        readinessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /server_info
            port: 9901
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
          - name: envoy-config
            mountPath: /etc/envoy
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config-db
        - name: mysql-init
          configMap:
            name: mysql-init-script
        - name: mysql-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: default
  labels:
    app: db
    metrics: envoy
spec:
  selector:
    app: db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3307
    - name: metrics
      port: 9901
      targetPort: 9901
