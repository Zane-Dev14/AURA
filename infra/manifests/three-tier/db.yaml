apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        metrics: envoy
    spec:
      containers:
      - name: db
        image: project-db:local
        imagePullPolicy: IfNotPresent
        env:
          - name: MYSQL_DATABASE
            value: quotesdb
          - name: MYSQL_ROOT_PASSWORD
            value: root
          - name: MYSQL_USER
            value: user
          - name: MYSQL_PASSWORD
            value: password
        command:
          - mysqld
          - --port=33060  # ✅ MySQL binds to 33060 instead
          - --bind-address=0.0.0.0
        ports:
          - containerPort: 33060
            name: mysql-internal
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
          - name: mysql-init
            mountPath: /docker-entrypoint-initdb.d

      - name: envoy
        image: envoyproxy/envoy:v1.29-latest
        command:
          - /usr/local/bin/envoy
          - -c
          - /etc/envoy/envoy.yaml
          - --service-cluster
          - db
        ports:
          - containerPort: 3306  # ✅ Envoy listens on 3306 (external)
            name: mysql
          - containerPort: 9901
            name: envoy-admin
        volumeMounts:
          - name: envoy-config
            mountPath: /etc/envoy
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config-db
        - name: mysql-init
          configMap:
            name: mysql-init-script

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: default
  labels:
    app: db
    metrics: envoy
spec:
  selector:
    app: db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306  # Routes to Envoy
    - name: metrics
      port: 9901
      targetPort: 9901

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config-db
  namespace: default
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: mysql_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 3306  # ✅ Envoy listens here
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: mysql
              cluster: mysql_cluster

      clusters:
      - name: mysql_cluster
        connect_timeout: 1s
        type: STATIC
        load_assignment:
          cluster_name: mysql_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 33060  # ✅ Forwards to MySQL on 33060

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  namespace: default
data:
  init.sql: |
    USE quotesdb;
    CREATE TABLE IF NOT EXISTS quotes (
      id INT AUTO_INCREMENT PRIMARY KEY,
      text VARCHAR(255) NOT NULL,
      author VARCHAR(100)
    );
    INSERT INTO quotes (text, author) VALUES 
      ('The only way to do great work is to love what you do.', 'Steve Jobs'),
      ('Innovation distinguishes between a leader and a follower.', 'Steve Jobs');