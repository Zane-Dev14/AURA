apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        metrics: envoy
    spec:
      containers:
      - name: api
        image: project-api:local
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
          - name: DB_HOST
            value: db
          - name: DB_USER
            value: user
          - name: DB_PASSWORD
            value: password
          - name: DB_NAME
            value: quotesdb
        ports:
          - containerPort: 5001

      - name: envoy
        image: envoyproxy/envoy:v1.29-latest
        command:
          - /bin/sh
          - -c
          - |
            sleep 5
            exec /usr/local/bin/envoy \
              -c /etc/envoy/envoy.yaml \
              --service-cluster api \
              --log-level info

        ports:
          - containerPort: 8080
          - containerPort: 9901
        volumeMounts:
          - name: envoy-config
            mountPath: /etc/envoy
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config-api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    metrics: envoy
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9901
      targetPort: 9901
